# Every pull request and every push to main runs the whole suite that a CI
# machine can run: `npm test`. The system tests are not here — they need the
# real Orca on a real desktop — and are run with `npm run test:system` before a
# slice that touches Orca or a harness is merged.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# `npm ci` runs whatever lifecycle scripts the dependencies carry, so the job
# gets a token that can only read this repo.
permissions:
  contents: read

jobs:
  # The version the kit is developed on: the current LTS line, pinned to the
  # release rather than left to follow the line. This is the job that says the
  # kit works.
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit: a tag can be moved to point at other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.8.0
      - run: npm ci
      - run: npm test

  # The floor `engines.node` promises users, so the promise stays checked. The
  # kit is what a user installs — the dependencies, not the development tools —
  # and the tests need nothing else, so this job installs exactly that, and
  # leaves out StrykerJS, which it has no use for.
  #
  # The floor is 24.21.0 because the book's lock is a SQLite write transaction
  # through Node's own `node:sqlite`, which is older than this line, and 24.21.0
  # is the first release measured here that loads it without an experimental
  # warning on stderr: 24.0.0 prints one, which would land in the output of every
  # command.
  # Nothing weaker takes the turn to write the book from a writer that is merely
  # stopped: a lease cannot, and neither can a check before the write.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      # Errors only: a real incompatibility here shows up as a failing test,
      # not as a notice from npm. Every package in the lock file accepts this
      # Node (its engines ranges checked against 24.21.0 on 2026-09-23).
      - run: npm ci --omit=dev --loglevel=error
      - run: npm test
