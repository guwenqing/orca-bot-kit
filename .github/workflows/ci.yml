# Every pull request runs the whole suite that a CI machine can run, split into
# shards that run side by side, on the Node the kit targets. The system tests
# are not here — they need the real Orca on a real desktop — and are run with
# `npm run test:system` before a slice that touches Orca or a harness is merged.
#
# A push to main runs nothing, and pull requests do not run the floor: the owner
# decided that on 2026-09-26 (#364), for a CI that answers in minutes. The risk
# taken with it: a pull request tested against an older main can merge into a
# combination no run checked. Publishing runs every shard on the target and on
# the floor before anything goes out (publish.yml), and that is what catches it.

name: CI

on:
  pull_request:

# `npm ci` runs whatever lifecycle scripts the dependencies carry, so the job
# gets a token that can only read this repo.
permissions:
  contents: read

jobs:
  # The version the kit is developed on: the current LTS line, pinned to the
  # release rather than left to follow the line.
  #
  # Node splits the files itself (`--test-shard`, round robin over the sorted
  # list), and `npm run test:shard` runs package.json's own list of files, so
  # the shards together run exactly what `npm test` runs. Nine shards: on the
  # file times measured for #364 the slowest came to about seven minutes, and a
  # release runs them on two Nodes, eighteen jobs, within the twenty a free
  # account runs at once.
  shard:
    name: shard ${{ matrix.shard }}/9
    runs-on: ubuntu-latest
    strategy:
      # One failing shard does not stop the others, so a run shows every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      # Actions are pinned to a commit: a tag can be moved to point at other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.8.0
      - run: npm ci
      - run: npm run test:shard
        env:
          SHARD: ${{ matrix.shard }}/9

  # Every pull request states its tier (AGENTS.md), and AssuredLoop's `al check
  # --strict` fails on a not ok the branch owns. It compares the branch with
  # main, so it needs the whole history. `al` comes from npm at the exact
  # version AGENTS.md names, the same pinned install a developer makes. al 1.0.0
  # needs Node 24 or newer.
  assuredloop:
    name: al check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.8.0
      - run: npm install --global @assuredloop/cli@1.0.0
      - run: al check --strict

  # The one check to read: it passes only when every shard passed. It runs even
  # when a shard failed or was cancelled, because a job that is skipped reads as
  # passing.
  test:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.shard.result }}
        run: |
          echo "The shards: $RESULT"
          [ "$RESULT" = success ]
