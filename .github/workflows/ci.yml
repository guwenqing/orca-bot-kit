# Every pull request and every push to main runs the whole suite that a CI
# machine can run: `npm test`. The system tests are not here — they need the
# real Orca on a real desktop — and are run with `npm run test:system` before a
# slice that touches Orca or a harness is merged.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# `npm ci` runs whatever lifecycle scripts the dependencies carry, so the job
# gets a token that can only read this repo.
permissions:
  contents: read

jobs:
  # The version the kit is developed on: the current LTS line, pinned to the
  # release rather than left to follow the line. This is the job that says the
  # kit works.
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit: a tag can be moved to point at other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: npm ci
      - run: npm test

  # The floor `engines.node` promises users, so the promise stays checked. The
  # kit is what a user installs — the dependencies, not the development tools —
  # and the tests need nothing else, so this job installs exactly that. It also
  # keeps StrykerJS, which wants a newer Node than the floor, out of a job that
  # has no use for it.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
      - run: npm ci --omit=dev
      - run: npm test
