# Publishes @assuredloop/orca-bot-kit to npm when a GitHub Release is published,
# and at no other time: a release is made by hand, so a person decides every
# version that goes out.
#
# No npm token is stored anywhere. npm trusts this repository and this file by
# name (npm's trusted publishing): the publish job asks GitHub for a short-lived
# identity token, npm checks it, and the package goes out with a provenance
# statement saying which commit built it. That needs npm 11.5.1 or newer, which
# the Node pinned below carries.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The same shards CI runs, on the same Node, against the commit the release
  # points at. Nothing is published from a commit that does not pass them.
  test:
    name: test ${{ matrix.shard }}/9
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.8.0
      - run: npm ci
      - run: npm run test:shard
        env:
          SHARD: ${{ matrix.shard }}/9

  # The floor `engines.node` promises users, so the promise is checked before
  # every release. Pull requests do not run it (ci.yml says why). The kit is
  # what a user installs — the dependencies, not the development tools — so
  # this job installs exactly that, and leaves out StrykerJS, which it has no
  # use for. It runs `test:floor`: every test file but those under test/dev/,
  # which need a development tool (#533). The test job above runs those, and
  # pull requests check that no file the floor runs needs one.
  #
  # The floor is 24.21.0 because the book's lock is a SQLite write transaction
  # through Node's own `node:sqlite`, which is older than this line, and 24.21.0
  # is the first release measured here that loads it without an experimental
  # warning on stderr: 24.0.0 prints one, which would land in the output of every
  # command.
  # Nothing weaker takes the turn to write the book from a writer that is merely
  # stopped: a lease cannot, and neither can a check before the write.
  floor:
    name: floor ${{ matrix.shard }}/9
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      # Errors only: a real incompatibility here shows up as a failing test,
      # not as a notice from npm. Every package in the lock file accepts this
      # Node (its engines ranges checked against 24.21.0 on 2026-09-23).
      - run: npm ci --omit=dev --loglevel=error
      - run: npm run test:floor
        env:
          SHARD: ${{ matrix.shard }}/9

  # The only job that can prove who it is to npm, so it installs nothing: `npm
  # ci` runs whatever lifecycle scripts the dependencies carry, and none of them
  # gets near the identity token. Publishing packs the files package.json lists
  # and needs no dependencies to do it.
  # It needs every shard on both Nodes: a matrix job passes only when all its
  # shards did.
  publish:
    needs: [test, floor]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.8.0
          registry-url: https://registry.npmjs.org
      # The release names the version; package.json is what npm publishes. They
      # have to agree, or the release says one version and npm gets another.
      - name: The release tag is v<package.json version>
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$want" ]; then
            echo "The release is tagged $TAG and package.json says $want. Make them agree, then publish the release again."
            exit 1
          fi
      # A pre-release goes out under `next`, so `npm install` keeps getting the
      # last full release.
      - name: npm publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then npm publish --tag next; else npm publish; fi
