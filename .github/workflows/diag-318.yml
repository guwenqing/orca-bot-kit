# TEMPORARY, for #318 only; removed before merge. Shows what Linux `ps` reports
# for the process chain test/helpers/cli.js `throughATab` builds, which passes
# on macOS and fails on ubuntu-latest.

name: diag-318

on:
  pull_request:

permissions:
  contents: read

jobs:
  chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 25.8.0
      - name: Build the chain and read it back
        run: |
          mkdir -p /tmp/chain && cd /tmp/chain
          cat > step.cjs <<'EOF'
          const { spawnSync } = require('node:child_process');
          const plan = JSON.parse(process.env.CHAIN);
          const next = Number(process.argv[2]);
          if (next < plan.length) {
            const ran = spawnSync(plan[next].file, [__filename, String(next + 1)], { argv0: plan[next].argv0, stdio: 'inherit' });
            process.exit(ran.status ?? 0);
          }
          spawnSync('/bin/sh', ['-c', 'node /tmp/chain/read.cjs; true'], { stdio: 'inherit' });
          EOF
          cat > read.cjs <<'EOF'
          const { spawnSync } = require('node:child_process');
          const fs = require('node:fs');
          const out = spawnSync('ps', ['-Ao', 'pid=,ppid=,comm='], { encoding: 'utf8' }).stdout;
          const tree = new Map(out.split('\n').map((l) => l.trim().match(/^(\d+)\s+(\d+)\s+(.*)$/)).filter(Boolean).map((m) => [Number(m[1]), { ppid: Number(m[2]), comm: m[3] }]));
          let pid = process.pid;
          for (let i = 0; i < 8 && tree.has(pid); i += 1) {
            const one = tree.get(pid);
            let proc = '?'; let exe = '?'; let cmdline = '?';
            try { proc = fs.readFileSync(`/proc/${pid}/comm`, 'utf8').trim(); } catch {}
            try { exe = fs.readlinkSync(`/proc/${pid}/exe`); } catch {}
            try { cmdline = fs.readFileSync(`/proc/${pid}/cmdline`, 'utf8').split('\0').slice(0, 2).join(' '); } catch {}
            console.log(`pid ${pid} ppid ${one.ppid} ps-comm=${JSON.stringify(one.comm)} proc-comm=${JSON.stringify(proc)} exe=${exe} argv=${JSON.stringify(cmdline)}`);
            pid = one.ppid;
          }
          EOF
          for n in login zsh claude; do ln -sf "$(command -v node)" "/tmp/chain/$n"; done
          export CHAIN='[{"file":"/tmp/chain/zsh","argv0":"-/tmp/chain/zsh"},{"file":"/tmp/chain/claude","argv0":"claude"}]'
          node -e "require('node:child_process').spawnSync('/tmp/chain/login', ['/tmp/chain/step.cjs','0'], { argv0: '/tmp/chain/login', stdio: 'inherit', env: process.env })"
          uname -a
